name: Live follower counts

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours (04:17, 10:17, 16:17, 22:17 Dubai)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: followers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check live Instagram and Facebook followers and update the site
        run: python3 .github/scripts/followers.py
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      - name: Save results to the repo
        run: |
          git config user.name "site-health-bot"
          git config user.email "site-health-bot@users.noreply.github.com"
          git add seo/data/followers-latest.md seo/data/followers-latest.json seo/data/followers-history.csv seo/data/followers-readings.csv app.js _src/app.part
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Live follower counts"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
